<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Hybrid Product Search</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Smooth Entrance Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Gradient Grid Pattern */
        .bg-grid-pattern {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Triple Ring Orbiting Loader */
        .loader {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #14b8a6; /* Teal */
            animation: spin 1s linear infinite;
        }
        .loader::before, .loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .loader::before {
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border-top-color: #6366f1; /* Indigo */
            animation: spin 1.5s linear infinite reverse;
        }
        .loader::after {
            top: 13px; left: 13px; right: 13px; bottom: 13px;
            border-top-color: #a855f7; /* Purple */
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6 md:p-12 relative overflow-x-hidden font-sans">

    <!-- Glowing Background blobs -->
    <div class="fixed inset-0 -z-10 bg-slate-950">
        <div class="absolute top-[-10%] left-[-10%] h-[600px] w-[600px] rounded-full bg-[radial-gradient(circle_farthest-side,rgba(99,102,241,0.12),transparent)]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] h-[600px] w-[600px] rounded-full bg-[radial-gradient(circle_farthest-side,rgba(20,184,166,0.12),transparent)]"></div>
        <div class="absolute inset-0 bg-grid-pattern"></div>
    </div>

    <!-- Header Section -->
    <header class="text-center max-w-2xl mb-12 animate-fade-in">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-teal-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent mb-4">
            Postgres Hybrid Search
        </h1>
        <p class="text-slate-400 text-base md:text-lg">
            Empower your RAG pipelines with the combined speed of relational search and vector embeddings in PostgreSQL.
        </p>
    </header>

    <!-- Search Container -->
    <div class="w-full max-w-2xl mb-12 animate-fade-in" style="animation-delay: 0.1s;">
        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-teal-500 to-indigo-500 rounded-2xl blur opacity-35 group-focus-within:opacity-60 transition duration-500"></div>
            <div class="relative flex items-center bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-2 pl-4">
                <svg class="w-6 h-6 text-slate-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 1 0-14 0 7 7 0 0 0 14 0z"></path>
                </svg>
                <input id="search-input" type="text"
                    class="w-full bg-transparent border-none text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-0 text-base"
                    placeholder="Search for products (e.g. 'high durability running shoes for adults')...">
                <button id="search-button"
                    class="bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-400 hover:to-indigo-500 text-white font-semibold px-6 py-3.5 rounded-xl transition duration-300 transform active:scale-95 flex items-center shadow-lg ml-2 flex-shrink-0">
                    Search
                </button>
            </div>
        </div>
    </div>

    <!-- AI Response Container -->
    <div id="ai-response-container" class="w-full max-w-3xl mb-12 hidden animate-fade-in" style="animation-delay: 0.2s;">
        <div class="relative p-6 rounded-2xl bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 shadow-xl overflow-hidden">
            <!-- Glow top left -->
            <div class="absolute top-0 left-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-xl -translate-x-12 -translate-y-12"></div>
            <div class="flex items-center space-x-2 mb-4">
                <span class="flex h-2.5 w-2.5 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-teal-500"></span>
                </span>
                <h3 class="text-xs font-semibold tracking-wider text-teal-400 uppercase">AI Search Insight</h3>
            </div>
            <div id="ai-response" class="text-slate-200 text-base md:text-lg leading-relaxed whitespace-pre-wrap"></div>
        </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl w-full animate-fade-in" style="animation-delay: 0.3s;">
    </div>

    <!-- Footer -->
    <footer class="mt-auto pt-16 pb-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 Postgres Hybrid Search System. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const aiResponseContainer = document.getElementById('ai-response-container');
        const aiResponse = document.getElementById('ai-response');
        const productGrid = document.getElementById('product-grid');

        // Allow pressing Enter key in search box
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchButton.click();
            }
        });

        searchButton.addEventListener('click', async () => {
            const query = searchInput.value.trim();
            if (query) {
                // Clear state, show response container with loader
                aiResponseContainer.classList.remove('hidden');
                aiResponse.innerHTML = '<div class="loader mx-auto my-4"></div>';
                productGrid.innerHTML = '';

                await fetchAIResponse(query);
            }
        });

        // Helper to render star rating using SVG stars
        function renderStars(rating) {
            const rounded = Math.round(rating);
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rounded) {
                    stars += `<svg class="w-4 h-4 text-amber-400 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                } else {
                    stars += `<svg class="w-4 h-4 text-slate-700 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
                }
            }
            return `<div class="flex items-center space-x-0.5">${stars}<span class="text-xs font-semibold text-slate-400 ml-1.5">(${rating})</span></div>`;
        }

        async function fetchAIResponse(query) {
            try {
                const response = await axios.post('/chat', {
                    query: query
                });

                if (response.status === 200 && response.data) {
                    const aiText = response.data.response;
                    const products = response.data.product_recommendations || [];

                    aiResponse.textContent = aiText;

                    products.forEach((product, idx) => {
                        const productCard = document.createElement('div');
                        productCard.className = 'group bg-slate-900/40 backdrop-blur-md border border-slate-800/80 rounded-2xl p-5 hover:border-teal-500/30 hover:shadow-[0_0_30px_rgba(20,184,166,0.1)] transition-all duration-500 flex flex-col justify-between opacity-0 translate-y-4';
                        productCard.style.animation = `fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards`;
                        productCard.style.animationDelay = `${(idx * 0.08) + 0.1}s`;

                        productCard.innerHTML = `
                            <div>
                                <div class="relative overflow-hidden rounded-xl mb-4 h-44 bg-slate-850">
                                    <img src="https://picsum.photos/300/400?random=${product.id}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-107 transition-transform duration-500">
                                    <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md text-slate-300 text-xs font-medium px-2.5 py-1 rounded-full border border-slate-800">
                                        ${product.category}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-100 group-hover:text-teal-400 transition-colors duration-300 mb-2 truncate">${product.name}</h3>
                                <p class="text-slate-400 text-sm line-clamp-3 mb-4 leading-relaxed">${product.description}</p>
                            </div>
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    ${renderStars(product.rating)}
                                    <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-md font-medium">
                                        ${product.age_group}
                                    </span>
                                </div>
                                <div class="flex items-center justify-between pt-3.5 border-t border-slate-800/60">
                                    <span class="text-xl font-extrabold bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">
                                        ${product.price} <span class="text-xs font-semibold text-slate-400 uppercase">${product.currency}</span>
                                    </span>
                                    <button class="bg-slate-800 hover:bg-teal-600 hover:text-white text-slate-300 text-xs font-semibold px-4 py-2 rounded-lg transition duration-300 border border-slate-700/80 hover:border-teal-500">
                                        Details
                                    </button>
                                </div>
                            </div>
                        `;
                        productGrid.appendChild(productCard);
                    });
                } else {
                    aiResponse.textContent = "No response found. Please try again.";
                }
            } catch (error) {
                aiResponse.textContent = "Error fetching data. Please try again later.";
                console.error('Error:', error);
            }
        }
    </script>
</body>

</html>
